<!doctype html>
<!--
  Source of social-preview.png (1280 x 640), the GitHub social preview.
  Regenerate from the repository root with a Chromium browser, for example:
  chrome --headless --hide-scrollbars --window-size=1280,640 \
    --screenshot=branding/social-preview.png branding/social-preview.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cover_Maker social preview</title>
    <style>
      @font-face {
        font-family: "Archivo SemiExpanded";
        src: url("../desktop/static/fonts/archivo/ArchivoSemiExpanded-Bold.woff2")
          format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Archivo SemiExpanded";
        src: url("../desktop/static/fonts/archivo/ArchivoSemiExpanded-SemiBold.woff2")
          format("woff2");
        font-weight: 600;
      }
      @font-face {
        font-family: "IBM Plex Sans";
        src: url("../desktop/static/fonts/ibm-plex-sans/IBMPlexSans-Regular.woff2")
          format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "IBM Plex Sans";
        src: url("../desktop/static/fonts/ibm-plex-sans/IBMPlexSans-Medium.woff2")
          format("woff2");
        font-weight: 500;
      }

      :root {
        --bg: #0c0b0a;
        --surface: #15130f;
        --surface-2: #1d1a16;
        --surface-3: #29251f;
        --fg: #f1e9dc;
        --muted: #a59d90;
        --accent: #ff6a3d;
        --well: #0f0d0a;
        --led: #8fd16a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1280px;
        height: 640px;
        overflow: hidden;
      }

      body {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 430px;
        gap: 48px;
        align-items: center;
        padding: 56px 72px 64px;
        background:
          radial-gradient(
            ellipse 900px 520px at 18% 30%,
            rgb(255 106 61 / 9%),
            transparent 70%
          ),
          var(--bg);
        color: var(--fg);
        font-family: "IBM Plex Sans", system-ui, sans-serif;
      }

      .brand {
        display: grid;
        gap: 22px;
        justify-items: start;
      }

      .lockup {
        display: flex;
        align-items: center;
        gap: 26px;
      }

      .lockup svg {
        width: 104px;
        height: 104px;
        filter: drop-shadow(0 10px 24px rgb(0 0 0 / 50%));
      }

      .wordmark {
        font-family: "Archivo SemiExpanded", sans-serif;
        font-weight: 700;
        font-size: 64px;
        letter-spacing: -0.02em;
        line-height: 1;
      }

      .wordmark span {
        color: var(--accent);
      }

      .tagline {
        margin: 0;
        font-family: "Archivo SemiExpanded", sans-serif;
        font-weight: 600;
        font-size: 34px;
        line-height: 1.15;
      }

      .lead {
        margin: 0;
        max-width: 600px;
        font-size: 21px;
        line-height: 1.45;
        color: var(--muted);
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 6px;
      }

      .chip {
        padding: 7px 14px;
        border: 1px solid rgb(241 233 220 / 20%);
        border-radius: 6px;
        background: var(--surface-2);
        box-shadow: inset 0 1px 0 rgb(241 233 220 / 6%);
        font-family: "Archivo SemiExpanded", sans-serif;
        font-weight: 600;
        font-size: 15px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .chip.accent {
        border-color: #e04e22;
        background: var(--accent);
        color: var(--bg);
      }

      /* A small hardware unit: six stem channels in a dark well. */
      .unit {
        padding: 16px;
        border: 1px solid rgb(241 233 220 / 20%);
        border-radius: 12px;
        background: var(--surface);
        box-shadow:
          inset 0 1px 0 rgb(241 233 220 / 4%),
          0 18px 40px rgb(0 0 0 / 55%);
      }

      .unit-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 6px 12px;
        font-family: "Archivo SemiExpanded", sans-serif;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .leds {
        display: flex;
        gap: 8px;
      }

      .led {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--surface-3);
      }

      .led.on {
        background: var(--led);
        box-shadow: 0 0 8px var(--led);
      }

      .lanes {
        display: grid;
        gap: 6px;
        padding: 12px;
        border-radius: 8px;
        background: var(--well);
        box-shadow: inset 0 2px 10px rgb(0 0 0 / 65%);
      }

      .lane {
        display: grid;
        grid-template-columns: 80px 1fr;
        align-items: center;
        gap: 12px;
        height: 46px;
        padding: 0 8px;
        border-radius: 4px;
        box-shadow: inset 3px 0 0 var(--stem);
      }

      .lane-name {
        font-family: "Archivo SemiExpanded", sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #a59d90;
      }

      .wave {
        display: flex;
        align-items: center;
        gap: 3px;
        height: 34px;
      }

      .wave i {
        flex: 1;
        border-radius: 2px;
        background: var(--stem);
      }

      .wave i.off {
        background: #2a251e;
      }

      .tape {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 8px;
        background: var(--accent);
      }
    </style>
  </head>
  <body>
    <section class="brand">
      <div class="lockup">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="31" fill="#15130f" stroke="#29251f" stroke-width="2" />
          <g transform="translate(32 32) scale(0.74) translate(-32.25 -29)">
            <path d="M27 37.5H59" fill="none" stroke="#ff6a3d" stroke-width="5" />
            <path
              d="M41.56 16.79A19 19 0 1 0 41.56 41.21"
              fill="none"
              stroke="#f1e9dc"
              stroke-width="5"
            />
            <path
              fill="#f1e9dc"
              fill-rule="evenodd"
              d="M16 29a11 11 0 1 0 22 0a11 11 0 1 0-22 0ZM23.8 29a3.2 3.2 0 1 0 6.4 0a3.2 3.2 0 1 0-6.4 0Z"
            />
          </g>
        </svg>
        <div class="wordmark">Cover<span>_</span>Maker</div>
      </div>
      <p class="tagline">The cover musician's studio</p>
      <p class="lead">
        Split any song into vocals, guitar, drums, bass, piano and other, or
        make a backing track without them. On your Windows PC.
      </p>
      <div class="chips">
        <span class="chip accent">Free &amp; open source</span>
        <span class="chip">100 % local</span>
        <span class="chip">English · Español</span>
      </div>
    </section>

    <section class="unit" aria-hidden="true">
      <div class="unit-head">
        <span>Stems</span>
        <span class="leds"
          ><span class="led on"></span><span class="led on"></span
          ><span class="led"></span
        ></span>
      </div>
      <div class="lanes" id="lanes"></div>
    </section>

    <div class="tape"></div>

    <script>
      const stems = [
        ["Vocals", "#ffcf5c"],
        ["Guitar", "#ff8f4d"],
        ["Drums", "#5fd3b5"],
        ["Bass", "#6fa8dc"],
        ["Piano", "#c8d46a"],
        ["Other", "#9b948a"],
      ];
      // Deterministic pseudo-random bars, so the image is reproducible.
      let seed = 7;
      const random = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      const lanes = document.getElementById("lanes");
      stems.forEach(([name, color], row) => {
        const lane = document.createElement("div");
        lane.className = "lane";
        lane.style.setProperty("--stem", color);
        lane.innerHTML = `<span class="lane-name">${name}</span><div class="wave"></div>`;
        const wave = lane.querySelector(".wave");
        const bars = 40;
        const played = Math.round(bars * (1 - row * 0.11));
        for (let i = 0; i < bars; i++) {
          const bar = document.createElement("i");
          const envelope = 0.35 + 0.65 * Math.abs(Math.sin((i + row * 3) / 6));
          bar.style.height = `${Math.max(8, Math.round(100 * envelope * (0.45 + 0.55 * random())))}%`;
          if (i >= played) bar.className = "off";
          wave.appendChild(bar);
        }
        lanes.appendChild(lane);
      });
    </script>
  </body>
</html>
