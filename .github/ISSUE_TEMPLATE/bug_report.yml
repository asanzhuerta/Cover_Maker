name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, expected and actual behaviour.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Cover_Maker version
  - type: textarea
    id: system
    attributes:
      label: System
      description: Windows version, CPU, RAM, GPU and VRAM.
