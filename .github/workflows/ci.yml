name: CI

# Every job runs on Windows, the reference platform, and on macOS (Apple
# Silicon), which is experimental (ADR-013). The Windows jobs keep their
# original names, which branch protection may require.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Engine (Python)
          - os: macos-latest
            name: Engine (Python, macOS)
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
        if: runner.os == 'Windows'
      - run: uv run ruff format --check .
        if: runner.os == 'Windows'
      - run: uv run pyright
        if: runner.os == 'Windows'
      - run: uv run pytest --cov=cover_maker --cov-report=term
      - name: Check the API contract used by the UI is up to date
        if: runner.os == 'Windows'
        shell: bash
        run: |
          uv run cover-maker openapi > ../desktop/src/lib/api/openapi.json
          git diff --exit-code -- ../desktop/src/lib/api/openapi.json
      # The macOS separation runtime: PyTorch from PyPI (with Metal) and the
      # separation extra install from the lock, diffq builds from its sdist,
      # and the engine detects the Apple GPU. CI runners are virtual machines,
      # so Metal may be missing there; nothing is separated here.
      - name: Install the macOS separation runtime
        if: runner.os == 'macOS'
        run: uv sync --locked --extra separation --extra mps
      - name: Check PyTorch, audio-separator and the hardware detection
        if: runner.os == 'macOS'
        run: |
          uv run --no-sync python -c "import torch; print('torch', torch.__version__, '| MPS built:', torch.backends.mps.is_built(), '| MPS available:', torch.backends.mps.is_available())"
          uv run --no-sync python -c "from audio_separator.separator import Separator; from cover_maker.separation.installer import separation_available; assert separation_available()"
          uv run --no-sync cover-maker doctor

  frontend:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Desktop UI (Svelte)
          - os: macos-latest
            name: Desktop UI (Svelte, macOS)
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - name: Check that every language has every string
        run: pnpm check:i18n
      - run: pnpm test
      - run: pnpm build

  shell:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Desktop shell (Rust)
          - os: macos-latest
            name: Desktop shell (Rust, macOS)
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
      - name: Create placeholder frontend build
        working-directory: desktop
        run: New-Item -ItemType Directory -Force build | Out-Null
        shell: pwsh
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  vst3:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: VST3 plugin (Rust)
          - os: macos-latest
            name: VST3 plugin (Rust, macOS)
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: daw/vst3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: daw/vst3
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Build the VST3 bundle
        if: runner.os == 'macOS'
        run: cargo xtask bundle cover_maker_vst3 --locked
