name: Docs

on:
  pull_request:
    paths: ["docs/**", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

jobs:
  latex:
    name: Build LaTeX documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Check generated tables are up to date
        run: |
          uv run docs/tools/gen_tex.py
          git diff --exit-code -- docs/latex/common/generated
      - name: Compile all documents
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          root_file: "*/main.tex"
          working_directory: docs/latex
          work_in_root_file_dir: true
          latexmk_use_lualatex: true
          pre_compile: git config --global --add safe.directory '*'
      - name: Collect PDFs
        run: |
          mkdir -p pdf
          for d in docs/latex/*/; do
            name=$(basename "$d")
            [ -f "$d/main.pdf" ] && cp "$d/main.pdf" "pdf/cover-maker-$name.pdf"
          done
          ls -l pdf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-maker-docs
          path: pdf/*.pdf
