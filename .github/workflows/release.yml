name: Release

# Builds the signed NSIS installer and the updater manifest on a version tag
# and attaches them, the ffmpeg mirror, the DAW plugin and script and the six
# PDF documents to a draft GitHub release. Publishing the draft stays a manual step.
#
# Authenticode signing (issue #51) goes through the SignPath Foundation and
# runs only when the repository variable SIGNPATH_ORGANIZATION_ID is set (plus
# the secret SIGNPATH_API_TOKEN); every signing request is approved by hand in
# SignPath. See docs/signing/README.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# The tag name reaches the run scripts only through this variable, never
# through ${{ }} interpolation inside a script (script injection).
env:
  REF_NAME: ${{ github.ref_name }}

jobs:
  installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:REF_NAME) {
            throw "tag $env:REF_NAME does not match tauri.conf.json version $version"
          }

      - name: Stage uv, the engine wheel and the lock files
        shell: pwsh
        run: ./desktop/scripts/prepare-runtime.ps1

      - name: Fetch the ffmpeg build to mirror
        shell: pwsh
        run: |
          $deps = Get-Content desktop/src-tauri/resources/runtime/deps.json -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Force mirror | Out-Null
          $file = Join-Path mirror $deps.ffmpeg.file
          Invoke-WebRequest $deps.ffmpeg.urls[-1] -OutFile $file
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $deps.ffmpeg.sha256) { throw "ffmpeg hash mismatch: $hash" }

      - run: pnpm install --frozen-lockfile
        working-directory: desktop

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: pnpm tauri
          args: --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Cover_Maker ${{ github.ref_name }}
          releaseBody: |
            See CHANGELOG.md for the changes in this release.

            Code signing policy and privacy notice: https://github.com/asanzhuerta/Cover_Maker#code-signing-policy
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true

      - name: Upload the unsigned installer for code signing
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        id: unsigned-installer
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Sign the installer (SignPath, approved by hand)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: Cover_Maker
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: signed

      - name: Replace the installer and its update signature with the signed ones
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = Get-ChildItem signed -Recurse -Filter *-setup.exe | Select-Object -First 1
          if (-not $exe) { throw "the signed installer is missing" }
          $auth = Get-AuthenticodeSignature $exe.FullName
          if ($auth.Status -ne "Valid") { throw "Authenticode signature is $($auth.Status)" }
          # The updater signature covers the file's bytes: sign the signed file again.
          pnpm --dir desktop tauri signer sign $exe.FullName
          gh release upload $tag $exe.FullName "$($exe.FullName).sig" --clobber
          New-Item -ItemType Directory -Force updater | Out-Null
          gh release download $tag -p latest.json -D updater --clobber
          $manifest = Get-Content updater/latest.json -Raw | ConvertFrom-Json
          $signature = (Get-Content "$($exe.FullName).sig" -Raw).Trim()
          foreach ($platform in $manifest.platforms.PSObject.Properties) {
            $platform.Value.signature = $signature
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content updater/latest.json -Encoding utf8NoBOM
          gh release upload $tag updater/latest.json --clobber

      - name: Attach the ffmpeg mirror
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$env:REF_NAME" (Get-ChildItem mirror/*.zip).FullName --clobber
        shell: pwsh

  daw:
    name: DAW plugin and script
    needs: installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: daw/vst3
      - name: Build the VST3 bundle
        working-directory: daw/vst3
        run: cargo xtask bundle cover_maker_vst3 --release --locked
      - name: Upload the unsigned plugin for code signing
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        id: unsigned-plugin
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-vst3
          path: daw/vst3/target/bundled/
          if-no-files-found: error
      - name: Sign the plugin (SignPath, approved by hand)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: Cover_Maker
          signing-policy-slug: release-signing
          artifact-configuration-slug: vst3-plugin
          github-artifact-id: ${{ steps.unsigned-plugin.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: daw/vst3/target/bundled
      - name: Package the plugin (GPL-3.0-or-later) and the REAPER script (MIT)
        shell: pwsh
        run: |
          $version = $env:REF_NAME.TrimStart("v")
          New-Item -ItemType Directory -Force out/vst3 | Out-Null
          Copy-Item -Recurse daw/vst3/target/bundled/Cover_Maker.vst3 out/vst3/
          Copy-Item daw/vst3/COPYING, daw/vst3/README.md out/vst3/
          Compress-Archive -Path out/vst3/* -DestinationPath "Cover_Maker-VST3-$version-x64.zip"
          Copy-Item "daw/reaper/Cover_Maker - Separate into stem tracks.lua" "Cover_Maker-REAPER-$version.lua"
      - name: Attach them to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release upload "$env:REF_NAME" (Get-ChildItem Cover_Maker-VST3-*.zip, Cover_Maker-REAPER-*.lua).FullName --clobber

  docs:
    name: Documentation PDFs
    needs: installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Compile all documents
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          root_file: "*/main.tex"
          working_directory: docs/latex
          work_in_root_file_dir: true
          latexmk_use_lualatex: true
          pre_compile: git config --global --add safe.directory '*'
      - name: Attach the PDFs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pdf
          for d in docs/latex/*/; do
            name=$(basename "$d")
            [ -f "$d/main.pdf" ] && cp "$d/main.pdf" "pdf/cover-maker-$name.pdf"
          done
          ls -l pdf
          test "$(ls pdf/*.pdf | wc -l)" -eq 6
          gh release upload "$REF_NAME" pdf/*.pdf --clobber
