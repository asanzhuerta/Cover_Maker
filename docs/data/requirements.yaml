# Requirements catalogue (single source of truth for the SRS and traceability).
# priority: must | should | could     status: proposed | accepted | implemented | verified

constraints:
  - id: CON-01
    title: No automatic discovery of music
    text: The software shall not search, scrape or match music on streaming services, nor use their APIs or web pages to locate music. Online audio is fetched only from links the user pastes explicitly.
  - id: CON-02
    title: User-declared rights
    text: Before processing online content the user shall confirm that they own it or are allowed to use it. Audio sources are limited to the user's files, user-supplied video links and catalogues with an explicit Creative Commons licence per item.
  - id: CON-03
    title: No bundled model weights
    text: The project shall not bundle or host AI model weights; each model is downloaded from its original source after the user accepts its licence.
  - id: CON-04
    title: No commercial audio in the repository
    text: Tests, examples, screenshots and documentation shall use only synthetic or Creative Commons audio with attribution.
  - id: CON-05
    title: Trademark neutrality
    text: Third-party service names shall appear only as plain text describing formats or compatibility, without logos and never in the product name.
  - id: CON-06
    title: Platform
    text: Version 1.0 targets Windows 10/11 64-bit only.

functional:
  - id: FR-SRC-01
    title: Open local files
    text: The user shall be able to add audio files (WAV, FLAC, MP3, M4A, OGG, OPUS, AAC) by drag and drop or a file dialog.
    priority: must
    milestone: M3
  - id: FR-SRC-02
    title: Watched folders
    text: The user shall be able to register folders whose new or changed audio files are processed incrementally.
    priority: must
    milestone: M4
  - id: FR-SRC-03
    title: Playlist file import
    text: The system shall import playlist files (streaming data export JSON, CSV, JSPF, M3U) and match their entries against the local library.
    priority: should
    milestone: M4
  - id: FR-SRC-04
    title: Creative Commons catalogues
    text: The system shall let the user browse and fetch items from Creative Commons catalogues, showing the licence and storing attribution.
    priority: should
    milestone: M8
  - id: FR-SRC-05
    title: Video links
    text: The user shall be able to paste a video or playlist link; the system shall download only the best available audio track using yt-dlp and show download progress.
    priority: must
    milestone: M4
  - id: FR-SRC-06
    title: Rights confirmation
    text: The system shall ask the user to confirm their rights to online content once per job and record the confirmation with the job.
    priority: must
    milestone: M4
  - id: FR-SEP-01
    title: Stem selection
    text: The user shall choose any subset of the stems vocals, guitar, drums, bass, piano and other.
    priority: must
    milestone: M3
  - id: FR-SEP-02
    title: Track without X
    text: The system shall render a mix of the song without the stems the user selects, optionally keeping the residual.
    priority: must
    milestone: M3
  - id: FR-SEP-03
    title: Presets
    text: The system shall offer Fast, Balanced and Max quality presets adapted to the detected hardware tier.
    priority: must
    milestone: M3
  - id: FR-MOD-01
    title: Model catalogue
    text: The system shall list available models with licence class, provenance, size and estimated memory, and download only models the user explicitly accepts.
    priority: must
    milestone: M3
  - id: FR-JOB-01
    title: Job queue
    text: The system shall queue jobs, show per-song step progress, and support pause, resume, cancel and retry.
    priority: must
    milestone: M3
  - id: FR-LIB-01
    title: Library and re-sync
    text: The system shall keep a library of processed recordings and reprocess only new or changed inputs on re-sync.
    priority: must
    milestone: M4
  - id: FR-LIB-02
    title: Match review
    text: The user shall review and correct matches between imported playlist entries and local files.
    priority: should
    milestone: M8
  - id: FR-MIX-01
    title: Preview mixer
    text: The user shall preview stems in sync with per-stem mute, solo and volume, and export the current mix.
    priority: must
    milestone: M7
  - id: FR-UI-01
    title: Languages
    text: The user interface shall be available in English and Spanish, and in community translations (Portuguese (Brazil), French, German and Italian) that have every string.
    priority: must
    milestone: M6
  - id: FR-UI-02
    title: First-run quick start
    text: On first run the system shall install the models recommended for the detected hardware with one action, once the user accepts their licence notices, and offer a bundled example song (CC0 or CC BY, under 30 s and 2 MB) whose stems keep its attribution, so that the first stems are ready within minutes of setup.
    priority: should
    milestone: Launch
  - id: FR-DAW-01
    title: REAPER tracks
    text: A REAPER script shall send a song to the running engine and insert each resulting stem as a new track aligned with the source.
    priority: should
    milestone: M11
  - id: FR-DAW-02
    title: VST3 plugin
    text: A VST3 plugin shall run a separation through the running engine and offer the stems for preview and drag-and-drop into tracks.
    priority: should
    milestone: M11
  - id: FR-DAW-03
    title: DAW session export
    text: From a separated song the system shall write a new folder with every stem, the residual and the original mix as WAV files aligned at 0, a REAPER project (.RPP), a DAWproject file and a Standard MIDI File that put each file on its own track with the mixer's volume, pan and mute, plus the tempo map fitted to the beat grid, the section markers and the key.
    priority: should
    milestone: Future work
  - id: FR-PRA-01
    title: Tuning and key
    text: The system shall estimate each song's tuning offset from A440 in cents and its key (tonic and major or minor), store them with the song and show them in the LCD panel as played after the pitch settings.
    priority: must
    milestone: M14
  - id: FR-PRA-02
    title: Tempo and beat grid
    text: The system shall estimate each song's tempo in BPM, beat times and bar starts (4/4) once per decoded mix, store them and show the tempo in the LCD panel.
    priority: must
    milestone: M14
  - id: FR-PRA-03
    title: Real-time pitch and tempo
    text: In the mixer the user shall shift the pitch by -12 to +12 semitones plus -50 to +50 cents and set the tempo from 50 % to 150 % without changing the pitch, with knob controls that work with the keyboard and in English and Spanish.
    priority: must
    milestone: M14
  - id: FR-PRA-04
    title: Loops, sections, count-in and click
    text: Loops shall snap to bar lines of the beat grid; the user shall name section markers and loop a section; playback may start after one bar of count-in; a click stem generated from the beat grid can be heard and exported.
    priority: should
    milestone: M14
  - id: FR-PRA-05
    title: Speed trainer
    text: The speed trainer shall raise (or lower) the tempo by a set step every N loop passes until it reaches a target, and show the tempo and the pass count in the LCD panel.
    priority: should
    milestone: M14
  - id: FR-PRA-06
    title: Exports with pitch and tempo
    text: The custom mix, the track without X and, on request, every stem and the click shall be exported with the chosen pitch and tempo, rendered by the engine with the same algorithm as the preview.
    priority: must
    milestone: M14

non_functional:
  - id: NFR-PERF-01
    title: GPU throughput
    text: On an NVIDIA GPU with 4 GB VRAM or more, the Balanced preset shall separate a 4-minute song into six stems in under 2 minutes (measured in M1 at about 80 s on an RTX 3050 Laptop 4 GB).
    priority: must
    milestone: M1
  - id: NFR-PERF-04
    title: CPU-only operation
    text: Without a usable GPU, the Fast preset shall separate a 4-minute song in under 5 minutes on a 6-core CPU from 2021 or newer (measured in M1 at about 2.5 minutes).
    priority: must
    milestone: M1
  - id: NFR-PERF-02
    title: Low-memory fallback
    text: On out-of-memory errors the system shall retry with smaller chunks and half precision before asking the user to fall back to CPU.
    priority: must
    milestone: M3
  - id: NFR-PERF-03
    title: DAW coexistence
    text: Separation shall run at reduced priority with a thread cap, and offer a low-impact mode when a DAW is running.
    priority: should
    milestone: M3
  - id: NFR-PERF-05
    title: Real-time stretch cost
    text: Pitch and tempo processing in the mixer shall cost under 10 % of one CPU core of a 6-core laptop CPU from 2021 with six stems loaded, since it runs once on the summed master bus.
    priority: should
    milestone: M14
  - id: NFR-SEC-01
    title: Local API protection
    text: The local engine shall listen on 127.0.0.1 only and require a per-session token, an exact Host header and an allowed Origin.
    priority: must
    milestone: M5
  - id: NFR-SEC-02
    title: Engine discovery
    text: Local clients such as DAW tools shall find the engine through a per-user file readable only by the user, with a client token separate from the shell's session token, and shall be subject to the Host and Origin checks.
    priority: must
    milestone: M11
  - id: NFR-REL-01
    title: Crash safety
    text: Jobs shall survive application restarts and worker crashes without corrupting the library.
    priority: must
    milestone: M3
  - id: NFR-MNT-01
    title: Downloader updates
    text: The yt-dlp dependency shall be updatable independently of application releases, because video platforms change frequently.
    priority: must
    milestone: M9
  - id: NFR-INST-01
    title: Small installer
    text: The installer should stay below 100 MB, downloading PyTorch and models on first run with resumable progress.
    priority: should
    milestone: M9
