# Milestones and risk register (source for the Project Plan).

milestones:
  - id: M0
    name: Clean-up and foundations
    effort: M
    goal: Remove v1, scaffold the monorepo, CI, LaTeX class and initial documents.
    status: Done
  - id: M1
    name: "Spike: AI models on target hardware"
    effort: M
    goal: Benchmark separation models on 4 GB VRAM and CPU; fix presets per hardware tier.
    status: Done
  - id: M2
    name: "Spike: shell, audio and bootstrap"
    effort: M
    goal: Validate Tauri-Python lifecycle, synced multi-stem playback and uv/torch bootstrap.
    status: Done
  - id: M3
    name: "Engine: separation and mixing core (CLI)"
    effort: L
    goal: Store, pipeline, job runner, model catalogue, recipes, GPU worker, mixer and CLI.
    status: Done
  - id: M4
    name: "Engine: library, folders and playlist import"
    effort: M
    goal: Video links via yt-dlp, watched folders, playlist-file import with local matching, re-sync; alpha CLI release.
    status: Done
  - id: M5
    name: Local API
    effort: S/M
    goal: FastAPI + WebSocket API with token, Host and Origin checks; generated TypeScript types.
    status: Done
  - id: M6
    name: Desktop MVP
    effort: L
    goal: First-run wizard, new job flow, queue, settings and EN/ES interface.
    status: Done
  - id: M7
    name: Preview mixer
    effort: L
    goal: Synced multi-stem mixer with waveforms and export of the current mix.
    status: Done
  - id: M8
    name: Library UI, matching and CC catalogues
    effort: M/L
    goal: Library view, match review and Creative Commons sources with attribution.
    status: Done
  - id: M9
    name: Installer, first run and updates
    effort: L
    goal: NSIS installer, two-phase bootstrap, auto-update; beta release.
    status: Done
  - id: M9.2
    name: First-run guide and polish
    effort: S
    goal: Guided welcome while the runtime installs, installer language, model download progress, layout, licence review and author data.
    status: Done
  - id: M10
    name: Quality and release 0.4.0
    effort: M
    goal: Hardening, accessibility, test report and the 0.4.0 release.
    status: Release after M13
  - id: M11
    name: DAW integration (VST3 + REAPER)
    effort: L
    goal: VST3 plugin as a client of the local engine, plus a REAPER extension that inserts each stem as a new track.
    status: Done (v0.4.0)
  - id: M12
    name: About and credits
    effort: S
    goal: About page with the author profile, the app description and the open-source credits, from one data file in EN/ES.
    status: Done
  - id: M13
    name: Visual identity (Tape & Console)
    effort: M
    goal: Own visual identity before 1.0 - warm hardware look, new logo and icons, icon rail and transport dock, LED meters and LCD panel, per-stem pan and keyboard shortcuts.
    status: In progress
  - id: M14
    name: Practice tools
    effort: L
    goal: Tuning, key and tempo analysis; real-time pitch shift and time-stretch; bar-snapped loops, count-in, click stem and speed trainer; exports with key and tempo applied.
    status: In progress
  - id: M15
    name: Cover studio (record audio and video)
    effort: L
    goal: Record takes and webcam video over the track without your instrument, in sync, and export cover videos; an "only my takes" export keeps the original master out of published material.
    status: Planned
  - id: M16
    name: Rehearsal and setlists
    effort: M
    goal: Per-song practice settings, setlists with a rehearsal/live mode, MIDI foot-switch control, batch export and shareable song preparations without audio.
    status: Planned
  - id: Launch
    name: Launch and growth
    effort: M
    goal: First-class repository and download (README, stable download link, signed installer, package managers, landing page, example song) and a launch in waves.
    status: Planned

risks:
  - id: R-01
    risk: Best multi-stem model does not fit in 4 GB VRAM or is too slow on CPU
    likelihood: low
    impact: high
    mitigation: Measured in M1 - SW fits 4 GB in fp16 (about 80 s per song); hardware tiers, fp16 first, smaller chunks as fallback, Demucs on CPU.
  - id: R-02
    risk: Licence or provenance problems with model weights
    likelihood: high
    impact: high
    mitigation: No default model, licence classes in the catalogue, recorded acceptance, weights never hosted.
  - id: R-03
    risk: Tauri shell and Python engine lifecycle issues (orphan processes)
    likelihood: medium
    impact: medium
    mitigation: Windows Job Object, parent watchdog, M2 kill test.
  - id: R-04
    risk: First-run download of PyTorch (about 2.5 GB) fails behind proxies or antivirus
    likelihood: medium
    impact: high
    mitigation: Two-phase bootstrap, resumable downloads, CPU option.
  - id: R-05
    risk: Creative Commons catalogue APIs change or close
    likelihood: medium
    impact: low
    mitigation: AudioSource interface, nightly canary tests, catalogues optional.
  - id: R-06
    risk: Separation load causes audio dropouts in a running DAW
    likelihood: medium
    impact: medium
    mitigation: Low priority, EcoQoS, thread cap, low-impact mode.
  - id: R-07
    risk: Legal exposure from user misuse or from v1 remnants
    likelihood: low
    impact: high
    mitigation: Legal-by-design constraints, rewritten history, disclaimer and export warnings.
  - id: R-08
    risk: DMCA or similar notice against the repository because of the video-link download feature
    likelihood: medium
    impact: high
    mitigation: Unmodified yt-dlp as a dependency, user-pasted links only, rights confirmation, disclaimer; respond as the yt-dlp project does and, if required, move the feature to a separate optional plugin.
  - id: R-09
    risk: The app is perceived as a clone of an earlier app with the same video-link-to-stems base (StemKit, August 2026)
    likelihood: medium
    impact: medium
    mitigation: Own visual identity in M13 before 1.0; positioning as the cover musician's studio with practice, recording and setlists (M14-M16); no code reuse in either direction.
  - id: R-10
    risk: Recording latency or audio/video drift in the webview makes recorded covers unusable
    likelihood: medium
    impact: high
    mitigation: Spike in M15 before building features; native capture (WASAPI) as fallback; latency calibration with a recorded click.
  - id: R-11
    risk: Users publish covers that contain the original master recording
    likelihood: medium
    impact: high
    mitigation: Separated stems act as guide tracks; an "only my takes" export for publishing; notices at export and in the User Manual.
  - id: R-12
    risk: Video encoding pulls in GPL codecs (x264) or patent-encumbered components
    likelihood: low
    impact: medium
    mitigation: LGPL ffmpeg build with hardware or operating-system H.264 encoders and the native AAC encoder; x264 is not bundled.
  - id: R-13
    risk: Launch promotion draws takedowns or community bans
    likelihood: medium
    impact: medium
    mitigation: Own or CC-licensed music only in all promotional material; video downloading is not used as the hook; each community's self-promotion rules are followed.
