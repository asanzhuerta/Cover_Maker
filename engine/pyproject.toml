[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cover-maker"
version = "0.3.0"
description = "Local AI stem separation engine for Cover_Maker."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "asanzhuerta and Cover_Maker contributors" }]
dependencies = [
    "fastapi>=0.120",
    "numpy>=2",
    "psutil>=7",
    "pydantic>=2.11",
    "pyyaml>=6",
    "rich>=14.0",
    "soundfile>=0.13",
    "tinytag>=2.1",
    "typer>=0.16",
    "uvicorn>=0.38",
    # yt-dlp's `default` extra without mutagen (GPL), which only embeds
    # metadata in post-processing; the engine keeps the original audio stream.
    "yt-dlp>=2026.10.26",
    "yt-dlp-ejs",
    "brotli",
    "certifi",
    "pycryptodomex",
    "requests",
    "urllib3",
    "websockets",
    "librosa>=1.0",
    "python-stretch==0.3.1",
]

[project.optional-dependencies]
# Heavy runtime for the separation worker (PyTorch + audio-separator). Pick
# the PyTorch build with exactly one of the `cpu` / `cu128` extras.
separation = [
    "audio-separator[cpu]==0.48.0",
    "audioread>=3",
    "torch>=2.8",
]
cpu = ["torch>=2.8"]
cu128 = ["torch>=2.8"]

[project.scripts]
cover-maker = "cover_maker.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "hypothesis>=6.130",
    "pyright>=1.1.400",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
    "types-pyyaml>=6.0.12.20261030",
    "xmlschema>=4.3.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cover_maker"]
# The example song is an MP3, which the repository's .gitignore excludes
# everywhere else; hatchling would otherwise leave it out of the wheel.
artifacts = ["src/cover_maker/data/example/*.mp3"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Layout is owned by `ruff format`; long string literals (SQL, messages) stay on one line.
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
# Dependency cooldown: resolve only versions published at least a week ago.
exclude-newer = "7 days"
environments = ["sys_platform == 'win32'"]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
