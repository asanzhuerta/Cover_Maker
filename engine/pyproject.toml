[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cover-maker"
version = "0.2.0.dev0"
description = "Local AI stem separation engine for Cover_Maker."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "asanzhuerta and Cover_Maker contributors" }]
dependencies = [
    "fastapi>=0.120",
    "psutil>=7",
    "rich>=14.0",
    "typer>=0.16",
    "uvicorn>=0.38",
]

[project.scripts]
cover-maker = "cover_maker.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pyright>=1.1.400",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cover_maker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
