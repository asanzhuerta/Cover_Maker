# Separation model catalogue. Weights are never bundled or hosted by this
# project: they are downloaded from their original sources (through the
# audio-separator package) only after the user accepts the licence notice.
#
# licence_class: permissive | disputed | none | non-commercial | copyleft
# stems: model output label -> Cover_Maker stem id
# sha256: pinned hash of the main weight file (null = recorded on first install)

models:
  - id: bs-roformer-sw
    name: BS-RoFormer SW (6 stems)
    filename: BS-Roformer-SW.ckpt
    architecture: bs-roformer
    stems: {Vocals: vocals, Guitar: guitar, Drums: drums, Bass: bass, Piano: piano, Other: other}
    size_mb: 667
    vram_mb_fp16: 2200
    sha256: 24e7d35ee9c64415673d3fd33e06a67cac2c103c5df6267ba1576459c775916e
    licence_class: none
    licence: No licence published. It was rehosted by jarredou, who says he did not train it and has no provenance information; his account no longer exists.
    licence_url: https://huggingface.co/elicwhite/bs-roformer-sw-6stem-onnx
    verified_on: 2026-11-03
    source: https://github.com/nomadkaraoke/python-audio-separator/releases/download/model-configs/BS-Roformer-SW.ckpt
    recommended_for: [balanced, max]

