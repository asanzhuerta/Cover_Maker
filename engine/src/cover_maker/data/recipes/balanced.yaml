# Balanced: one BS-RoFormer SW pass gives all six stems; the karaoke model
# splits its vocals into lead and backing when a job asks for them.
nodes:
  - {id: sw, model: bs-roformer-sw, input: mix}
  - {id: lead, model: bs-roformer-karaoke-anvuew, input: "stem:sw.vocals"}
outputs:
  vocals: sw.vocals
  guitar: sw.guitar
  drums: sw.drums
  bass: sw.bass
  piano: sw.piano
  other: sw.other
  vocals.lead: lead.vocals.lead
  vocals.backing: lead.vocals.backing
